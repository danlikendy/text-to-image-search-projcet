name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU, no torch for unit tests)
        run: pip install pandas numpy pytest joblib
      - name: Tests
        run: pytest tests/ -q
